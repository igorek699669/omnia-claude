name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seed:
        description: "Синхронизация каталога товаров"
        required: false
        default: none
        type: choice
        options:
          # none   — обычный деплой, каталог не трогаем
          # sync   — привести каталог к payload/seed.ts (остатки и фото не трогает)
          # photos — проставить фото по числу верхних нот: заполнить пустой media[]
          #          и заменить съёмку из seed.ts, если товару досталась не своя дека
          # full   — ⚠️ полный пересид, удаляет ВСЕ products и media. Только на пустой базе.
          - none
          - sync
          - photos
          - full

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Ворота перед выкаткой: push в main деплоит на прод сразу, поэтому сборка образа
  # начинается только после зелёных E2E (.github/workflows/e2e.yml).
  e2e:
    uses: ./.github/workflows/e2e.yml

  build-and-push:
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_YANDEX_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_YANDEX_MAPS_API_KEY }}

      - name: Build and push migrate image (builder stage, has CLI)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          push: true
          tags: ${{ env.IMAGE }}:migrate
          build-args: |
            NEXT_PUBLIC_YANDEX_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_YANDEX_MAPS_API_KEY }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Список закрытый: переменная из блока env: ниже доедет до сервера, только
          # если она перечислена здесь, иначе ${VAR} в скрипте развернётся в пустоту
          # и в .env.local уедет пустое значение — молча, без единой ошибки.
          envs: SEED,GITHUB_TOKEN,GITHUB_ACTOR,POSTGRES_PASSWORD,BETTER_AUTH_SECRET,BETTER_AUTH_URL,PAYLOAD_SECRET,SMTP_HOST,SMTP_PORT,SMTP_SECURE,SMTP_USER,SMTP_PASSWORD,SMTP_FROM,SMS_RU_API_ID,YOOKASSA_SHOP_ID,YOOKASSA_SECRET_KEY,CDEK_ACCOUNT,CDEK_SECURE_PASSWORD,DADATA_API_KEY
          script: |
            set -e
            mkdir -p /opt/omnia
            cd /opt/omnia
            if [ ! -d .git ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git fetch origin main
              git reset --hard origin/main
            fi

            cat > .env <<EOF
            POSTGRES_USER=omnia
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=omnia
            EOF

            cat > .env.local <<EOF
            BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
            BETTER_AUTH_URL=${BETTER_AUTH_URL}
            PAYLOAD_SECRET=${PAYLOAD_SECRET}
            SMTP_HOST=${SMTP_HOST}
            SMTP_PORT=${SMTP_PORT}
            SMTP_SECURE=${SMTP_SECURE}
            SMTP_USER=${SMTP_USER}
            SMTP_PASSWORD=${SMTP_PASSWORD}
            SMTP_FROM=${SMTP_FROM}
            SMS_RU_API_ID=${SMS_RU_API_ID}
            YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID}
            YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY}
            # Тестовый магазин — для товаров с чекбоксом «тестовая оплата»
            # (payload/collections/Products.ts): по ним прод-чекаут проходится целиком без
            # списания денег. Ключи те же, что в локальном .env.local, и лежат прямо здесь,
            # а не в Secrets: тестовый магазин реальных денег не двигает. Боевые заказы это
            # не трогает — им идут YOOKASSA_SHOP_ID/YOOKASSA_SECRET_KEY выше.
            YOOKASSA_TEST_SHOP_ID=1417637
            YOOKASSA_TEST_SECRET_KEY=test_PjKsc2-YGwnpvwwwUUAxUhr6J6G6u1tv2j9mPj9GyuY
            # Боевой контур и код пункта приёма зашиты здесь, а не в Secrets/Variables:
            # ни то ни другое не секрет, а прод всегда на боевом договоре — локально
            # остаётся edu-контур (дефолт в src/shared/lib/cdek.ts). BRK16 — офис СДЭК,
            # куда мастерская сама сдаёт груз: оба используемых тарифа «от склада».
            CDEK_API_URL=https://api.cdek.ru/v2
            CDEK_ACCOUNT=${CDEK_ACCOUNT}
            CDEK_SECURE_PASSWORD=${CDEK_SECURE_PASSWORD}
            CDEK_SHIPMENT_POINT=BRK16
            DADATA_API_KEY=${DADATA_API_KEY}
            EOF

            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            # --profile tools обязателен и здесь: без него pull пропускает сервис migrate
            # (у него profiles: ["tools"]), и запускается старый закешированный образ.
            docker compose -f docker-compose.prod.yml --profile tools pull
            # SEED передаём только при ручном запуске с выбранным режимом: обычный push
            # в main каталог не трогает (SEED пустой -> deploy:migrate обновит только схему).
            docker compose -f docker-compose.prod.yml --profile tools run --rm -e SEED="$SEED" migrate
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
        env:
          # "none" и обычный push (inputs пустой) дают пустую строку — сид не запустится.
          # Работает потому, что "1"/"sync"/"photos" — непустые строки, а значит truthy.
          SEED: ${{ inputs.seed == 'full' && '1' || inputs.seed == 'sync' && 'sync' || inputs.seed == 'photos' && 'photos' || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          # Без SMS_RU_API_ID вход по телефону не работает: номер, на который должен
          # позвонить покупатель, выдаёт SMS.ru (см. src/features/phone-auth).
          SMS_RU_API_ID: ${{ secrets.SMS_RU_API_ID }}
          YOOKASSA_SHOP_ID: ${{ secrets.YOOKASSA_SHOP_ID }}
          YOOKASSA_SECRET_KEY: ${{ secrets.YOOKASSA_SECRET_KEY }}
          CDEK_ACCOUNT: ${{ secrets.CDEK_ACCOUNT }}
          CDEK_SECURE_PASSWORD: ${{ secrets.CDEK_SECURE_PASSWORD }}
          # Без ключа поле адреса курьерской доставки остаётся обычным вводом, а сверка
          # дома по реестру ГАР не выполняется — заказ проходит с любым текстом.
          DADATA_API_KEY: ${{ secrets.DADATA_API_KEY }}
